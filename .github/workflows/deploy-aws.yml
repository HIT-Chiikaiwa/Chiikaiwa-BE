# =============================================================
# Chiikaiwa-BE — Build & Deploy to AWS EC2
# =============================================================
# Workflow:
#   1. Build JAR trên GitHub Actions (FREE)
#   2. Build Docker image nhẹ (run-only, ~250MB)
#   3. Push image lên Amazon ECR
#   4. SSH vào EC2 → pull image mới → restart container
# =============================================================

name: Build & Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # Cho phép trigger thủ công từ GitHub UI

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: chiikaiwa-be

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 + cache Maven dependencies ───────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Build JAR (trên GitHub runner — FREE) ──────────
      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests -B

      # ── 4. Configure AWS credentials ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 5. Login to Amazon ECR ────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 6. Build & Push Docker image (run-only) ───────────
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building image with aws.Dockerfile (run-only, no Maven)..."
          docker build -f aws.Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # ── 7. Deploy to EC2 via SSH ──────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY
          script: |
            echo "🔄 Starting deployment..."
            
            # Login ECR
            aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            # Pull image mới
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
            
            # Stop container cũ (nếu có)
            docker stop chiikaiwa-be 2>/dev/null || true
            docker rm chiikaiwa-be 2>/dev/null || true
            
            # Start container mới (Dùng --network host và mount file Firebase vào container)
            docker run -d \
              --name chiikaiwa-be \
              --restart unless-stopped \
              --network host \
              --env-file /home/ec2-user/chiikaiwa/.env \
              -v /home/ec2-user/chiikaiwa/firebase-service-account.json:/app/firebase-service-account.json \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest
            
            # Dọn image cũ để giải phóng ổ cứng EC2
            docker image prune -f
            
            echo "✅ Deployment complete!"
            echo "📋 Container status:"
            docker ps --filter name=chiikaiwa-be
