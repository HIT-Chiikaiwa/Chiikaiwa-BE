name: Admin and session security tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/admin_function]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run admin, Redis and WebSocket tests
        run: bash ./mvnw -B '-Dtest=org.hit.chiikaiwabe.admin.*Test' -Dtest.redis.port=6379 test
