# =============================================================
# Chiikaiwa-BE - AWS Profile
# =============================================================
# This profile is activated when running on AWS EC2
# It overrides configurations from application.properties
# =============================================================

# Database - AWS RDS PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA - disable sql logs for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Redis - running on EC2 (localhost)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Brevo API
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=${BREVO_NAME}

# Firebase (Read directly from JSON string)
firebase.credentials=${FIREBASE_CREDENTIALS}

# Swagger - enabled for dev/staging, disable for prod
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Multipart - use /tmp directly (always exists in Linux, avoids Tomcat subdirectory cleanup)
spring.servlet.multipart.location=/tmp

# Logging - reduce for production
logging.level.root=WARN
logging.level.org.hit.chiikaiwabe=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
