# =============================================================
# Chiikaiwa-BE ? AWS Profile
# =============================================================
# Profile này ???c kích ho?t khi ch?y trên AWS EC2
# Override các config t? application.properties (profile m?c ??nh)
# =============================================================

# Database ? AWS RDS PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA ? t?t log SQL cho production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Redis ? ch?y trên cùng EC2 (localhost)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Brevo API
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=${BREVO_NAME}

# Swagger ? b?t cho dev/staging, t?t cho production
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Logging ? gi?m b?t cho production
logging.level.root=WARN
logging.level.org.hit.chiikaiwabe=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
