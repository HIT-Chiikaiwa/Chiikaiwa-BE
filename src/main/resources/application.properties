#App
server.port=8080
spring.application.name=project-base
spring.config.import=optional:file:.env[.properties]

#DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/StudyDate
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#JPA / HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#JWT
jwt.secret=${JWT_SECRET}

#Expiration time (minutes)
jwt.access.expiration_time=30
jwt.refresh.expiration_time=10080

#Cloudinary
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=

#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Swagger
springdoc.api-docs.enabled=true
springdoc.packagesToScan=org.hit.chiikaiwabe.controller
springdoc.pathsToMatch=/**

#Info Admin
admin.username=admin1
admin.password=admin1
admin.lastName=Vien
admin.firstName=Quan Tri

#Redis
spring.data.redis.host=${REDIS_USERNAME}
spring.data.redis.port=${REDIS_PORT}

#Radar
radar.default-radius-km=5
radar.max-radius-km=20
radar.ttl-minutes=30